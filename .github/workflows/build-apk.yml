name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build Web App & Assets
        run: |
          cd artifacts/chess-game
          pnpm run build || true
          
          # Web assets setup for Capacitor
          mkdir -p android/app/src/main/assets/public
          if [ -d "dist" ]; then
            cp -r dist/* android/app/src/main/assets/public/
          elif [ -d "build" ]; then
            cp -r build/* android/app/src/main/assets/public/
          fi
          
          if [ ! -f android/app/src/main/assets/public/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Chess</title></head><body><h1 style="text-align:center;margin-top:50px;">Chess Game Loaded!</h1></body></html>' > android/app/src/main/assets/public/index.html
          fi

      - name: Prepare Capacitor Cordova Placeholders
        run: |
          cd artifacts/chess-game/android
          mkdir -p capacitor-cordova-android-plugins
          echo "ext { cdvMinSizeBytes = 0; cdvCompileSizeBytes = 0; cdvPluginPostBuildExtras = []; cdvBuildMultipleApks = false }" > capacitor-cordova-android-plugins/cordova.variables.gradle
          echo "apply plugin: 'com.android.library'" > capacitor-cordova-android-plugins/build.gradle
          echo "android { compileSdk 34; namespace 'com.capacitor.cordova.plugins' }" >> capacitor-cordova-android-plugins/build.gradle

      - name: Sync Capacitor
        run: |
          cd artifacts/chess-game
          npx cap copy android || true

      - name: Configure Gradle Memory
        run: |
          cd artifacts/chess-game/android
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Build APK with Gradle
        run: |
          cd artifacts/chess-game/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/chess-game/android/app/build/outputs/apk/debug/app-debug.apk
