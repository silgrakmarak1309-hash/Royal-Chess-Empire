name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Ensure Capacitor AdMob Plugin Installed
        run: |
          cd artifacts/chess-game
          pnpm add @capacitor-community/admob@latest || true

      - name: Configure Capacitor App & AdMob
        run: |
          CONFIG_PATH="artifacts/chess-game/capacitor.config.ts"
          if [ -f "$CONFIG_PATH" ]; then
            cat << 'EOF' > $CONFIG_PATH
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.royalchessclub.app',
            appName: 'Royal Chess Empire',
            webDir: 'dist',
            server: {
              url: 'https://royal-chess-empire--silgrakmarak130.replit.app',
              cleartext: true
            }
          };

          export default config;
          EOF
          fi

      - name: Build Web App
        env:
          PORT: 8080
          BASE_PATH: /
          VITE_APP_ENV: production
          VITE_API_URL: "https://royal-chess-empire--silgrakmarak130.replit.app"
          VITE_SERVER_URL: "https://royal-chess-empire--silgrakmarak130.replit.app"
          VITE_ADMOB_REWARDED_ID: "ca-app-pub-4647188052127146/8272006137"
        run: |
          cd artifacts/chess-game
          pnpm run build

      - name: Sync Web Assets & AdMob Plugins to Android
        run: |
          cd artifacts/chess-game
          npx cap sync android

      - name: Prepare Capacitor Cordova Placeholders
        run: |
          cd artifacts/chess-game/android
          mkdir -p capacitor-cordova-android-plugins
          echo "ext { cdvMinSizeBytes = 0; cdvCompileSizeBytes = 0; cdvPluginPostBuildExtras = []; cdvBuildMultipleApks = false }" > capacitor-cordova-android-plugins/cordova.variables.gradle
          echo "apply plugin: 'com.android.library'" > capacitor-cordova-android-plugins/build.gradle
          echo "android { compileSdk 34; namespace 'com.capacitor.cordova.plugins' }" >> capacitor-cordova-android-plugins/build.gradle

      - name: Safely Inject AdMob App ID & Cleartext Traffic via Python
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          import os

          manifest_path = "artifacts/chess-game/android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
              tree = ET.parse(manifest_path)
              root = tree.getroot()
              
              application = root.find("application")
              if application is not None:
                  application.set("{http://schemas.android.com/apk/res/android}usesCleartextTraffic", "true")
                  
                  # Check if admob meta-data already exists
                  exists = False
                  for child in list(application):
                      if child.tag == "meta-data" and child.get("{http://schemas.android.com/apk/res/android}name") == "com.google.android.gms.ads.APPLICATION_ID":
                          child.set("{http://schemas.android.com/apk/res/android}value", "ca-app-pub-4647188052127146~5480668756")
                          exists = True
                          break
                  
                  if not exists:
                      meta = ET.Element("meta-data")
                      meta.set("{http://schemas.android.com/apk/res/android}name", "com.google.android.gms.ads.APPLICATION_ID")
                      meta.set("{http://schemas.android.com/apk/res/android}value", "ca-app-pub-4647188052127146~5480668756")
                      application.append(meta)
                      
              tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
              print("AndroidManifest.xml successfully updated with AdMob ID!")
          '

      - name: Configure Gradle Memory
        run: |
          cd artifacts/chess-game/android
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Build APK with Gradle
        run: |
          cd artifacts/chess-game/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/chess-game/android/app/build/outputs/apk/debug/app-debug.apk
