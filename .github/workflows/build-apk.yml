name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Dummy Dist Folder
        run: |
          cd artifacts/chess-game
          mkdir -p dist
          echo "<html><body>Chess Game</body></html>" > dist/index.html

      - name: Sync Capacitor Android
        run: |
          cd artifacts/chess-game
          npx cap sync android || true

      - name: Build APK with Gradle
        run: |
          cd artifacts/chess-game/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/chess-game/android/app/build/outputs/apk/debug/app-debug.apk
