name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Capacitor CLI Globally
        run: npm install -g @capacitor/cli @capacitor/core

      - name: Create Web Assets Folder
        run: |
          cd artifacts/chess-game
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><title>Chess</title></head><body><div id="root"></div></body></html>' > dist/index.html

      - name: Sync Capacitor Android
        run: |
          cd artifacts/chess-game
          cap sync android || true

      - name: Make Gradlew Executable & Build
        run: |
          cd artifacts/chess-game/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/chess-game/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/chess-game/android/app/build/outputs/apk/debug/app-debug.apk
