name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build Web App & Assets
        run: |
          cd artifacts/chess-game
          pnpm run build || true
          
          # Fix Web Assets Location for Capacitor
          mkdir -p android/app/src/main/assets/public
          
          if [ -d "dist" ]; then
            cp -r dist/* android/app/src/main/assets/public/
          elif [ -d "build" ]; then
            cp -r build/* android/app/src/main/assets/public/
          fi
          
          if [ ! -f android/app/src/main/assets/public/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Chess</title></head><body><h1 style="text-align:center;margin-top:50px;">Chess Game Loaded!</h1></body></html>' > android/app/src/main/assets/public/index.html
          fi
          
          echo '[]' > android/app/src/main/assets/capacitor.plugins.json

      - name: Sync Capacitor Plugins
        run: |
          cd artifacts/chess-game
          npx cap sync android || true

      - name: Inject Cordova & Gradle Compatibility Fix
        run: |
          cd artifacts/chess-game/android
          mkdir -p capacitor-cordova-android-plugins
          cat << 'EOF' > capacitor-cordova-android-plugins/cordova.variables.gradle
          ext {
              cdvMinSizeBytes = 0
              cdvCompileSizeBytes = 0
              cdvPluginPostBuildExtras = []
              cdvBuildMultipleApks = false
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "android.overridePathCheck=true" >> gradle.properties

      - name: Build APK with Gradle
        run: |
          cd artifacts/chess-game/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.debug=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/chess-game/android/app/build/outputs/apk/debug/app-debug.apk
