name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies with NPM
        run: |
          cd artifacts/chess-game
          npm install --legacy-peer-deps

      - name: Create Web Dist Folder
        run: |
          cd artifacts/chess-game
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><title>Chess</title></head><body><div id="root"></div></body></html>' > dist/index.html

      - name: Sync Capacitor Plugins
        run: |
          cd artifacts/chess-game
          npx cap update android
          npx cap copy android

      - name: Ensure Cordova Variables File Exists
        run: |
          cd artifacts/chess-game/android
          mkdir -p capacitor-cordova-android-plugins
          echo "ext { cdvMinSizeBytes = 0 }" > capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Build APK with Gradle
        run: |
          cd artifacts/chess-game/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/chess-game/android/app/build/outputs/apk/debug/app-debug.apk
