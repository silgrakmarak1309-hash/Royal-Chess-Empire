name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          cd artifacts/chess-game
          pnpm install

      - name: Create Web Dist Folder
        run: |
          cd artifacts/chess-game
          pnpm run build --if-present

      - name: Sync Capacitor Plugins
        run: |
          cd artifacts/chess-game
          npx cap sync

      - name: Ensure Cordova Variables File Exists
        run: |
          cd artifacts/chess-game
          mkdir -p android/app/src/main/assets/
          touch android/app/src/main/assets/capacitor.config.json || true

      - name: Build APK with Gradle
        run: |
          cd artifacts/chess-game/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/chess-game/android/app/build/outputs/apk/debug/app-debug.apk
