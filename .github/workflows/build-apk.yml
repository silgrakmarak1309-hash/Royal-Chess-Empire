name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Configure Capacitor Server URL for Live Backend
        run: |
          CONFIG_PATH="artifacts/chess-game/capacitor.config.ts"
          if [ -f "$CONFIG_PATH" ]; then
            cat << 'EOF' > $CONFIG_PATH
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.royalchessclub.app',
            appName: 'Royal Chess Empire',
            webDir: 'dist',
            server: {
              url: 'https://royal-chess-empire--silgrakmarak130.replit.app',
              cleartext: true
            }
          };

          export default config;
          EOF
          fi

      - name: Build Web App
        env:
          PORT: 8080
          BASE_PATH: /
          VITE_APP_ENV: production
          VITE_API_URL: "https://royal-chess-empire--silgrakmarak130.replit.app"
          VITE_SERVER_URL: "https://royal-chess-empire--silgrakmarak130.replit.app"
        run: |
          cd artifacts/chess-game
          pnpm run build

      - name: Sync Web Assets & Server Settings to Android
        run: |
          cd artifacts/chess-game
          npx cap sync android

      - name: Prepare Capacitor Cordova Placeholders
        run: |
          cd artifacts/chess-game/android
          mkdir -p capacitor-cordova-android-plugins
          echo "ext { cdvMinSizeBytes = 0; cdvCompileSizeBytes = 0; cdvPluginPostBuildExtras = []; cdvBuildMultipleApks = false }" > capacitor-cordova-android-plugins/cordova.variables.gradle
          echo "apply plugin: 'com.android.library'" > capacitor-cordova-android-plugins/build.gradle
          echo "android { compileSdk 34; namespace 'com.capacitor.cordova.plugins' }" >> capacitor-cordova-android-plugins/build.gradle

      - name: Configure Android Permissions
        run: |
          MANIFEST_PATH="artifacts/chess-game/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST_PATH"
          fi

      - name: Configure Gradle Memory
        run: |
          cd artifacts/chess-game/android
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Build APK with Gradle
        run: |
          cd artifacts/chess-game/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/chess-game/android/app/build/outputs/apk/debug/app-debug.apk
